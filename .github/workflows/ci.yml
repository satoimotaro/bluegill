name: CI

# BlueGill is assembled with Keil C51 (AX51/LX51/Ohx51) under Wine — a proprietary,
# licensed, Windows toolchain. GitHub-hosted runners cannot provide it (the upstream
# Bluejay CI downloads a password-protected Wine+Keil bundle from repo secrets; this
# fork has none). So CI does NOT build the firmware — it runs fast, no-Keil sanity
# checks. Real build + flash + bench verification happens locally via
# `tools/build/build.sh` (Wine+Keil); prebuilt images live in `prebuilt/`.

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  sanity:
    name: Sanity (no-Keil)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Repo structure
        run: |
          set -euo pipefail
          for f in Makefile tools/build/build.sh \
                   src/Bluejay.asm src/Modules/SineMode.asm src/Modules/Settings.asm; do
            if [ ! -f "$f" ]; then echo "::error::missing expected file $f"; exit 1; fi
          done
          echo "structure OK"

      - name: Validate Intel-HEX images
        run: |
          set -euo pipefail
          shopt -s nullglob
          n=0
          for h in prebuilt/*.hex; do
            # every Intel-HEX file must end with the EOF record :00000001FF
            if tail -n1 "$h" | tr -d '\r' | grep -qx ':00000001FF'; then
              echo "OK  $h"; n=$((n+1))
            else
              echo "::error::$h missing Intel-HEX EOF record"; exit 1
            fi
          done
          echo "validated $n hex image(s)"

      - name: Shellcheck build scripts (advisory)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck tools/build/*.sh || echo "::warning::shellcheck findings (advisory, non-blocking)"
